name: Process Project Submission

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process-and-create-pr:
    # Run if issue has the 'project-submission' label OR matches submission title/body
    if: >-
      contains(github.event.issue.labels.*.name, 'project-submission') ||
      startsWith(github.event.issue.title, 'Project:') ||
      contains(github.event.issue.body, '### GitHub Repository URL')
    runs-on: ubuntu-latest
    concurrency:
      group: submission-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Process submission & update catalog
        id: process
        run: node scripts/process-submission.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_SENDER: ${{ github.event.issue.user.login }}

      - name: Validate updated catalog schema
        run: pnpm run validate

      - name: Create Pull Request via GitHub CLI
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.process.outputs.branch_name }}
          PR_TITLE: ${{ steps.process.outputs.pr_title }}
          PR_BODY: ${{ steps.process.outputs.pr_body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Ensure labels exist in repository
          gh label create "project-submission" --color "0E8A16" --description "New open source project submission" 2>/dev/null || true
          gh label create "ready-for-review" --color "1D76DB" --description "Automated PR ready for maintainer review" 2>/dev/null || true
          
          # Tag original issue if label wasn't applied yet
          if [ -n "$ISSUE_NUM" ]; then
            gh issue edit "$ISSUE_NUM" --add-label "project-submission" 2>/dev/null || true
          fi

          # Check if branch already exists remotely
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH already exists. Checking it out..."
            git checkout -B "$BRANCH" origin/"$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          
          git add data/projects.json data/projects-enriched.json public/data/projects-enriched.json
          
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "$PR_TITLE"
            git push -u origin "$BRANCH" --force
          fi
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: $EXISTING_PR"
            echo "pr_url=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            PR_URL=$(gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH" \
              --label "project-submission,ready-for-review" 2>/dev/null) || \
            PR_URL=$(gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH")
            echo "Created PR: $PR_URL"
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          fi

      - name: Comment on Original Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_BODY: |
            🚀 **شكراً لمساهمتك! / Thank you for your submission!**

            تم التحقق من بيانات المشروع بنجاح، وتوليد طلب سحب آلي (Pull Request) للمراجعة والاعتماد:
            Your submission was verified and an automated Pull Request has been opened for maintainer review:

            👉 **[عرض طلب السحب / View Pull Request](${{ steps.create-pr.outputs.pr_url }})**
        run: |
          gh issue comment "$ISSUE_NUM" --body "$COMMENT_BODY"

      - name: Notify on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          FAILURE_BODY: |
            ⚠️ **تنبيه / Notice:**

            تعذر إكمال معالجة الاقتراح آلياً. قد يكون السبب:
            - المستودع غير متاح أو خاص (Private)
            - المشروع مضاف بالفعل في الدليل
            - نقص في أحد الحقول الإلزامية

            سيقوم مدير المشروع بمراجعة الاقتراح يدوياً في أقرب وقت.

            Automated processing encountered an issue. A maintainer will review this submission manually.
        run: |
          gh issue comment "$ISSUE_NUM" --body "$FAILURE_BODY"
