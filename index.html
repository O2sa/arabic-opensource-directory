    <!-- Critical Anti-FOUC Theme & Direction Script -->
    <style>
      html {
        color-scheme: dark light;
      }
      html, html[data-theme="dark"] {
        background-color: #0b0f19;
        color: #f8fafc;
      }
      html[data-theme="light"] {
        background-color: #f8fafc;
        color: #0f172a;
      }
    </style>
    <script>
      (function() {
        try {
          // 1. Language from URL path (/ar or /en) has highest priority
          var path = window.location.pathname.toLowerCase();
          var pathParts = path.split('/');
          var pathLang = null;
          for (var p = 0; p < pathParts.length; p++) {
            if (pathParts[p] === 'ar' || pathParts[p] === 'en') {
              pathLang = pathParts[p];
              break;
            }
          }

          var lang = pathLang;
          if (!lang) {
            var savedLang = localStorage.getItem('ar_dir_lang');
            if (savedLang === 'ar' || savedLang === 'en') {
              lang = savedLang;
            } else {
              var navLangs = navigator.languages || [navigator.language || ''];
              var prefersArabic = false;
              for (var i = 0; i < navLangs.length; i++) {
                if (navLangs[i] && navLangs[i].toLowerCase().indexOf('ar') === 0) {
                  prefersArabic = true;
                  break;
                }
              }
              lang = prefersArabic ? 'ar' : 'en';
            }
          }
          document.documentElement.lang = lang;
          document.documentElement.dir = (lang === 'ar' ? 'rtl' : 'ltr');

          // 2. Theme Detection
          var savedTheme = localStorage.getItem('ar_dir_theme');
          if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
